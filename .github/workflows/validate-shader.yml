name: Validate Lumina Shader Lite

on:
  push:
    branches:
      - main
      - luminalitedev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate shader source and metadata
        run: python scripts/validate_shader.py
